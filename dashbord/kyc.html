
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../static/dashbordcss/dashboardjs.js" defer></script>
    <link rel="stylesheet" href="../static/font-awesome/css/font-awesome.min.css">
    <link rel="icon" type="icon/image" href="../static/img/logo.jpg">
    <link rel="stylesheet" href="../static/dashbordcss/dashbordcss.css">
    <link rel="stylesheet" href="../static/dashbordcss/dashbordmedia.css">

    <title>Thebotbrokers</title>
</head>
<body>
    <div>
        
        <section>
            <div class="menu-top">
                <div class="menu-name">
                    <h3>welcome user name</h3>
                </div>
            </div>
        </section>

        <section>
            <div class="body-box">
                <div class="body-box-con">
                    <div style="display: flex; align-items: center;justify-content: space-between;">
                        <div>
                            <a href="dashbord.html" style="color: white;margin-right: 10px;">
                                <i class="fa fa-arrow-left" style="text-transform: capitalize;font-weight: bold;"> dashboard</i>
                            </a>
                        </div>
                        <div>
                            <h4>KYC</h4>
                        </div>
                    </div>
                    <div class="balance">
                        <div class="balane-card">
                            <div class="info">
                                <h3>Information</h3>
                                <p>Dear user full name</p>
                                <p>complet your KYC</p>
                            </div>
                        </div>
                        <div class="home-intro-auth">
                            <div class="home-intro-box-auth">
                                <div class="form-box">
                                    <form action="dashbord/dashbord.html" method="post" enctype="multipart/form-data">
                                        {% csrf_token %}
                                        <div>
                                            <div class="form-text">
                                                <p>Country</p>
                                            </div>
                                            <div class="form-div">
                                                <input type="text" placeholder="Your Country" name="country">
                                                <i class="fa fa-arrow-left"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="form-text">
                                                <p>Phone number</p>
                                            </div>
                                            <div class="form-div">
                                                <input type="text" placeholder="Your Phone Number" name="phone">
                                                <i class="fa fa-arrow-left"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="form-text">
                                                <p>Address</p>
                                            </div>
                                            <div class="form-div">
                                                <textarea name="address" placeholder="Your Address" id=""></textarea>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="form-text">
                                                <p>Date of birth</p>
                                            </div>
                                            <div class="form-div">
                                                <input type="date" name="date">
                                                <i class="fa fa-arrow-left"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="form-text">
                                                <p>Gender</p>
                                            </div>
                                            <div class="form-div">
                                                <select>
                                                    <option value="">Selete Gender</option>
                                                    <option value="male">Male</option>
                                                    <option value="female">Female</option>
                                                    <option value="custom">Custom</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <button>verify informations</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
