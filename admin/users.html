
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../static/dashbordcss/dashboardjs.js" defer></script>
    <link rel="stylesheet" href="../static/font-awesome/css/font-awesome.min.css">
    <link rel="icon" type="icon/image" href="../static/img/logo.jpg">
    <link rel="stylesheet" href="../static/dashbordcss/dashbordcss.css">
    <link rel="stylesheet" href="../static/dashbordcss/dashbordmedia.css">

    <title>Thebotbrokers</title>
</head>
<body>
    <div>
        
        <section>
            <div class="menu-top">
                <div class="menu-name">
                    <h3>welcome user name</h3>
                </div>
            </div>
        </section>

        <section>
            <div class="body-box">
                <div class="body-box-con">
                    <div style="display: flex; align-items: center;justify-content: space-between;">
                        <div>
                            <h4>dashboard</h4>
                        </div>
                        <div>
                            <a href="dashbord.html" style="color: white;margin-right: 10px;">
                                <i class="fa fa-power-off" style="text-transform: capitalize;font-weight: lighter;">
                                    log out
                                </i>
                            </a>
                        </div>
                    </div>
                    <div class="balance">
                        <div class="balane-card">
                            <p>investments</p>
                            <div style="display: flex;">
                                <i class="fa fa-cubes"> 10</i>
                            </div>
                        </div>
                        <div style="margin-top: 10px;">
                            <a href="creatinvestment.html" class="achor-blue">
                                view investments
                            </a>
                        </div>
                        <br>
                    </div>
                    <div class="balance">
                        <div class="balane-card">
                            <p>total users</p>
                            <div style="display: flex;">
                                <i class="fa fa-users"> 10</i>
                            </div>
                        </div>
                        <div class="">
                            <form action="dashbord/dashbord.html" method="post" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="form-search">
                                    <input type="text" placeholder="Search" name="query">
                                    <button class="search-btn">search</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="balance">
                        <div class="balane-card">
                            <div class="infos">
                                <h3>user name</h3>
                                <h1>
                                    <i class="fa fa-dollar"> 100.00</i>
                                </h1>
                                <div style="margin-top: 10px;">
                                    <a href="userprofile.html" class="achor-blue">
                                        view profile
                                    </a>
                                </div>
                            </div>
                            <div class="infos">
                                <h3>user name</h3>
                                <h1>
                                    <i class="fa fa-dollar"> 250.00</i>
                                </h1>
                                <div style="margin-top: 10px;">
                                    <a href="userprofile.html" class="achor-blue">
                                        view profile
                                    </a>
                                </div>
                            </div>
                            <div class="infos">
                                <h3>user name</h3>
                                <h1>
                                    <i class="fa fa-dollar"> 500.00</i>
                                </h1>
                                <div style="margin-top: 10px;">
                                    <a href="userprofile.html" class="achor-blue">
                                        view profile
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
